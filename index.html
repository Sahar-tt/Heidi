<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heidi - Interactive Storybook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="storybook-container">
    <header>
      <h1>Heidi by Johanna Spyri</h1>
    </header>

    <main class="page-content">
      <!-- Your live animated illustration -->
      <div class="illustration-wrapper">
        <img src="Screenshot 2026-10-26 at 15.02.07.png" alt="Heidi Cover Illustration" class="live-illustration" />
      </div>

      <!-- Story Text & Audio Player -->
      <div class="text-wrapper">
        <p class="story-text">
          High up in the Swiss Alps, a little girl named Heidi began her great adventure.
        </p>

        <div class="audio-controls">
          <audio id="narration-audio" controls>
            <!-- Your uploaded audio file will connect here -->
            <source src="heidi-narration.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
          </audio>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
