
<script>
  const scene = document.querySelector(".illustration-wrapper");
  const heidi = document.querySelector(".heidi");
  const goat = document.querySelector(".goat");

  scene.addEventListener("mousemove", (event) => {
    const bounds = scene.getBoundingClientRect();

    const mouseX = event.clientX - bounds.left;
    const mouseY = event.clientY - bounds.top;

    const heidiX = Math.max(
      0,
      Math.min(mouseX - heidi.offsetWidth / 2,
      scene.clientWidth - heidi.offsetWidth)
    );

    const heidiY = Math.max(
      0,
      Math.min(mouseY - heidi.offsetHeight / 2,
      scene.clientHeight - heidi.offsetHeight)
    );

    heidi.style.left = heidiX + "px";
    heidi.style.top = heidiY + "px";

    goat.style.left = Math.max(
      0,
      Math.min(mouseX - goat.offsetWidth / 2 + 40,
      scene.clientWidth - goat.offsetWidth)
    ) + "px";

    goat.style.top = Math.max(
      0,
      Math.min(mouseY - goat.offsetHeight / 2 + 30,
      scene.clientHeight - goat.offsetHeight)
    ) + "px";
  });
</script>
</body>
</html>
